<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="lpInitial">

    <header>
        <img src="assets/janela.png" alt="" class="lpJanela">
        <img src="assets/among-09.png" alt=""class="lpAmogus">
        <div class="lpQuadroTentativas">

            <div class="lpQuadro">
                <h3>TENTATIVAS</h3>

            </div>

            <p>adivinhe a palavra secreta de 5 letras</p>

        </div>

    </header>


    <main>

        <div class="lpContainer">

            <div class="lpBorda">

                <input
                    type="text"
                    placeholder="Acerte a palavra"
                    maxlength="5"
                    class="lpInputSenha"
                >

                <button class="lpBtnEnviar">
                    ENVIAR
                </button>


                
                <div class="lpSenha">
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                </div>


                
                <div class="lpSenha">
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                </div>


                
                <div class="lpSenha">
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                </div>


                
                <div class="lpSenha">
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                </div>


                
                <div class="lpSenha">
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                </div>


                
                <div class="lpSenha">
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                </div>

            </div>

        </div>

    </main>


    

    <div class="resultado" id="resultado">

    <div class="resultadoCaixa">

        <h2 id="resultadoTitulo"></h2>

        <img src="assets/among-09.png" alt="Among Us">

        <p id="palavraResultado"></p>

        <button id="jogarNovamente">
            JOGAR NOVAMENTE
        </button>

    </div>

</div>



    <script src="script.js"></script>

</body>
</html>
