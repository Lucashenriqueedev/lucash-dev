<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termo Among Us</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="lpInitial">

    <header>
        <img src="assets/janela.png" alt="" class="lpJanela">
        <img src="assets/among-09.png" alt="Among Us" class="lpAmogus">

        <div class="lpQuadroTentativas">
            <div class="lpQuadro">
                <h3>TENTATIVAS</h3>
                <h1>
                    <span class="lpTentativas">0</span>/6
                </h1>
            </div>
            <p>adivinhe a palavra secreta de 5 letras</p>
        </div>

        <img src="assets/painel.png" alt="" class="lpPainel">

        <button class="lpBtnReturn" type="button">
            <img src="assets/return.png" alt="Reiniciar" class="lpImg">
        </button>
    </header>

    <main>
        <div class="lpContainer">
            <div class="lpBorda">
                <input 
                    type="text" 
                    placeholder="Acerte a palavra" 
                    maxlength="5" 
                    class="lpInputSenha"
                    autocomplete="off"
                >

                <button class="lpBtnEnviar" type="button">
                    ENVIAR
                </button>

                <div class="lpSenha">
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                </div>

                <div class="lpSenha">
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                </div>


                <div class="lpSenha">
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                </div>


                <div class="lpSenha">
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                </div>


                <div class="lpSenha">
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                </div>

                <div class="lpSenha">
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                    <div class="lpDigito"></div>
                </div>
            </div>
        </div>
    </main>


    <div class="resultado" id="resultado">
        <div class="resultadoCaixa">
            <button id="lpBtnReset" type="button">
                <img src="assets/return.png" alt="Resetar jogo">
            </button>

            <h2 id="resultadoTitulo">Vitória</h2>

            <img src="assets/among-09.png" alt="Among Us">

            <p id="palavraResultado"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
